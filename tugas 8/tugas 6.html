<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media di Halaman Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Menampilkan Gambar, Video, dan Audio</h1>

    <div class="main-content">
        
        <div class="card">
            <h2>Gambar</h2>
            <img src="image.jpg" alt="Contoh Gambar">
        </div>

        <div class="card">
            <h2>Video</h2>
            <video controls>
                <source src="video.mp4" type="video/mp4">
            </video>
        </div>

        <div class="card">
            <h2>Audio</h2>
            <audio controls>
                <source src="lagu.mp3">
            </audio>
        </div>

    </div>

</body>
</html>
