<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media di Halaman Web</title>
</head>
<body>

    <h1>Menampilkan Gambar, Video, dan Audio</h1>

    <!-- BAGIAN GAMBAR -->
    <h2>Gambar</h2>
    <img src="image.jpg" alt="Contoh Gambar" width="300">

    <!-- BAGIAN VIDEO -->
    <h2>Video</h2>
    <video width="200" controls>
        <source src="video.mp4" type="video/mp4">
        Browser tidak mendukung video.
    </video>

    <!-- BAGIAN AUDIO -->
    <h2>Audio</h2>
    <audio  controls>
        <source src="lagu.mp3">
        Browser tidak mendukung audio.
    </audio>

</body>
</html>
